<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" role="img" aria-label="3rd Eye Oilfield Supply and Services LLP">
  <title>3rd Eye Oilfield Supply &amp; Services LLP</title>
  <defs>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D97706"/>
      <stop offset="1" stop-color="#138808"/>
    </linearGradient>
  </defs>
  <g transform="translate(6,8)">
    <!-- outer eye almond -->
    <path d="M2 32 C 18 8, 46 8, 62 32 C 46 56, 18 56, 2 32 Z"
          fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <!-- iris -->
    <circle cx="32" cy="32" r="13" fill="url(#iris)"/>
    <!-- pupil / focal dot -->
    <circle cx="32" cy="32" r="5.2" fill="#0A2E5C"/>
    <!-- highlight -->
    <circle cx="36" cy="28" r="2" fill="#FFFFFF" opacity="0.85"/>
    <!-- third eye radiant dot above -->
    <circle cx="32" cy="-2" r="4.4" fill="#D97706"/>
    <g stroke="#D97706" stroke-width="2.2" stroke-linecap="round">
      <line x1="32" y1="-11" x2="32" y2="-16"/>
      <line x1="22" y1="-6" x2="18" y2="-9"/>
      <line x1="42" y1="-6" x2="46" y2="-9"/>
    </g>
  </g>
  <g font-family="Poppins, Arial, sans-serif" fill="#FFFFFF">
    <text x="82" y="36" font-size="30" font-weight="700" letter-spacing="0.5">
      3<tspan fill="#D97706">rd</tspan> EYE
    </text>
    <text x="84" y="58" font-size="11.5" font-weight="400" letter-spacing="2.4" fill="#CFD8E3">
      OILFIELD SUPPLY &amp; SERVICES LLP
    </text>
  </g>
</svg>